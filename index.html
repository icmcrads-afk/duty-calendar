<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방사선과 당직표</title>
  <style>
    /* ===== 전역 리셋 ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== 색상·크기 변수 ===== */
    :root {
      --bg:          #f4f6f9;
      --surface:     #ffffff;
      --border:      #d8dde5;
      --text:        #1a1d23;
      --muted:       #6b7280;
      --primary:     #1565c0;
      --primary-dk:  #0d47a1;

      --today-bg:    #fffde7;
      --today-bdr:   #f9a825;

      --sat-bg:      #e3f2fd;
      --sat-txt:     #1565c0;
      --hol-bg:      #ffebee;
      --hol-txt:     #b71c1c;

      --mine-bg:     #e8f5e9;
      --mine-bdr:    #43a047;

      --duty-bg:     #e3f2fd;
      --duty-txt:    #0d47a1;
      --am-bg:       #bbdefb;
      --am-txt:      #0d47a1;
      --pm-bg:       #90caf9;
      --pm-txt:      #0d3c87;
      --lunch-bg:    #fff8e1;
      --lunch-txt:   #e65100;
      --early-bg:    #f3e5f5;
      --early-txt:   #6a1b9a;

      --radius:      8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== 상단 헤더 ===== */
    .app-header {
      background: var(--primary);
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .app-header h1 { font-size: 1rem; font-weight: 700; }
    #sync-status { font-size: 0.78rem; opacity: 0.85; }

    /* ===== 내 이름 설정 바 ===== */
    .name-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 7px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .name-bar label { color: var(--text); font-weight: 600; white-space: nowrap; }
    .name-bar input {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.82rem;
      width: 90px;
    }

    /* ===== 오류 알림 바 ===== */
    .error-bar {
      background: #ffebee;
      color: #b71c1c;
      padding: 7px 16px;
      font-size: 0.82rem;
      display: none;
    }
    .error-bar.show { display: block; }

    /* ===== 월 네비게이션 ===== */
    .month-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .month-nav button {
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 11px;
      cursor: pointer;
      font-size: 0.88rem;
      color: var(--text);
    }
    .month-nav button:hover { background: var(--bg); }
    #month-title { font-size: 1.1rem; font-weight: 700; min-width: 110px; text-align: center; }

    /* ===== 탭 버튼 ===== */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 9px 4px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.88rem;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      font-family: inherit;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 700;
    }

    /* ===== 달력 래퍼 ===== */
    .cal-wrap { padding: 10px; max-width: 960px; margin: 0 auto; }

    /* ===== 요일 헤더 행 ===== */
    .dow-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-bottom: 3px;
    }
    .dow-cell {
      text-align: center;
      font-size: 0.73rem;
      font-weight: 700;
      padding: 3px 0;
      color: var(--muted);
    }
    .dow-cell.sun { color: var(--hol-txt); }
    .dow-cell.sat { color: var(--sat-txt); }

    /* ===== 달력 그리드 ===== */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    /* ===== 날짜 셀 ===== */
    .day-cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px;
      min-height: 82px;
      overflow: hidden;
    }
    .day-cell.empty      { background: transparent; border-color: transparent; }
    .day-cell.is-sat     { background: var(--sat-bg); }
    .day-cell.is-sun     { background: var(--hol-bg); }
    .day-cell.is-holiday { background: var(--hol-bg); }
    .day-cell.is-today   { background: var(--today-bg); border-color: var(--today-bdr); border-width: 2px; }
    .day-cell.is-mine    { border-color: var(--mine-bdr); border-width: 2px; }

    /* 날짜 숫자 */
    .d-num {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .is-sat .d-num     { color: var(--sat-txt); }
    .is-sun .d-num     { color: var(--hol-txt); }
    .is-holiday .d-num { color: var(--hol-txt); }

    /* 오늘 표시 점 */
    .today-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--today-bdr);
      border-radius: 50%;
      margin-left: 3px;
      vertical-align: middle;
    }

    /* 공휴일 이름 */
    .hol-name {
      font-size: 0.62rem;
      color: var(--hol-txt);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== 배정 배지(슬롯) ===== */
    .slot {
      display: block;
      border-radius: 3px;
      padding: 1px 4px;
      margin-top: 2px;
      font-size: 0.70rem;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slot-duty  { background: var(--duty-bg);  color: var(--duty-txt); }
    .slot-am    { background: var(--am-bg);    color: var(--am-txt); }
    .slot-pm    { background: var(--pm-bg);    color: var(--pm-txt); }
    .slot-lunch { background: var(--lunch-bg); color: var(--lunch-txt); }
    .slot-early { background: var(--early-bg); color: var(--early-txt); }
    .slot-mine  { font-weight: 700; background: var(--mine-bg); color: #2e7d32; }

    /* 조기출근 탭 셀은 높이를 좀 더 줄임 */
    .early-tab .day-cell { min-height: 58px; }

    /* ===== 범례 ===== */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 10px 10px 14px;
      max-width: 960px;
      margin: 0 auto;
      font-size: 0.74rem;
      color: var(--muted);
    }
    .leg-item { display: flex; align-items: center; gap: 4px; }
    .leg-dot {
      width: 11px; height: 11px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ===== 설정 패널 (공휴일 관리) ===== */
    .settings-panel {
      display: none;
      background: #f0f4ff;
      border-bottom: 2px solid var(--primary);
      padding: 12px 16px;
    }
    .settings-panel.open { display: block; }
    .settings-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-dk);
      margin-bottom: 6px;
    }
    .settings-desc { font-size: 0.76rem; color: var(--muted); margin-bottom: 8px; }
    .settings-form {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }
    .settings-form input {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 0.82rem;
      font-family: inherit;
      background: #fff;
    }
    .settings-form input[type="date"] { width: 138px; }
    .settings-form input[type="text"] { flex: 1; min-width: 100px; }
    .settings-form button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 5px 14px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      white-space: nowrap;
    }
    .settings-form button:hover { background: var(--primary-dk); }
    .hol-list { display: flex; flex-direction: column; gap: 4px; }
    .hol-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.80rem;
    }
    .hol-item-info { flex: 1; }
    .hol-item-date { font-weight: 700; color: var(--primary-dk); margin-right: 6px; }
    .hol-del-btn {
      background: none;
      border: 1px solid #ef5350;
      border-radius: 3px;
      color: #c62828;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 0.74rem;
      font-family: inherit;
    }
    .hol-del-btn:hover { background: #ffebee; }
    .hol-empty { font-size: 0.78rem; color: var(--muted); font-style: italic; }

    /* ===== 모바일 반응형 ===== */
    @media (max-width: 500px) {
      .day-cell  { min-height: 60px; padding: 3px; }
      .d-num     { font-size: 0.78rem; }
      .slot      { font-size: 0.62rem; padding: 1px 2px; }
      .hol-name  { font-size: 0.58rem; }
      .cal-wrap  { padding: 5px; }
    }
  </style>
</head>
<body>

<!-- 상단 헤더 -->
<header class="app-header">
  <h1>방사선과 당직표</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <button onclick="toggleSettings()"
      style="background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.35);border-radius:5px;padding:4px 11px;cursor:pointer;color:#fff;font-size:0.80rem;font-family:inherit;">
      ⚙ 공휴일 관리
    </button>
    <span id="sync-status">로컬 모드</span>
  </div>
</header>

<!-- 내 이름 설정 (내 일정 강조용 — localStorage에만 저장) -->
<div class="name-bar">
  <label for="my-name-input">내 이름:</label>
  <input type="text" id="my-name-input" placeholder="이름 입력" maxlength="10" autocomplete="off">
  <span>← 입력하면 내 일정이 초록 테두리로 강조됩니다</span>
</div>

<!-- 공휴일 관리 패널 (헤더 버튼으로 열고 닫음) -->
<div class="settings-panel" id="settings-panel">
  <div class="settings-title">임시 공휴일 추가</div>
  <p class="settings-desc">예상치 못한 휴일(임시공휴일 등)을 추가합니다. 추가된 날은 공휴일로 처리됩니다.</p>
  <div class="settings-form">
    <input type="date" id="hol-date-input">
    <input type="text" id="hol-name-input" placeholder="공휴일 이름 (예: 임시공휴일)" maxlength="20">
    <button onclick="addCustomHoliday()">추가</button>
  </div>
  <div id="custom-hol-list"><div class="hol-empty">추가된 공휴일이 없습니다.</div></div>
</div>

<!-- 동기화/오류 안내 (평소에는 숨김) -->
<div class="error-bar" id="error-bar"></div>

<!-- 월 이동 네비게이션 -->
<div class="month-nav">
  <button id="btn-prev" aria-label="이전 달">◀</button>
  <div id="month-title"></div>
  <button id="btn-next" aria-label="다음 달">▶</button>
  <button id="btn-today">오늘</button>
</div>

<!-- 탭 선택 -->
<div class="tabs">
  <button class="tab-btn active" id="tab-duty"  onclick="switchTab('duty')">당직 · 점심</button>
  <button class="tab-btn"        id="tab-early" onclick="switchTab('early')">조기출근</button>
</div>

<!-- 달력 영역 -->
<div class="cal-wrap" id="cal-wrap">
  <!-- 요일 헤더 -->
  <div class="dow-row">
    <div class="dow-cell sun">일</div>
    <div class="dow-cell">월</div>
    <div class="dow-cell">화</div>
    <div class="dow-cell">수</div>
    <div class="dow-cell">목</div>
    <div class="dow-cell">금</div>
    <div class="dow-cell sat">토</div>
  </div>
  <!-- 날짜 셀은 JS로 채움 -->
  <div class="cal-grid" id="cal-grid"></div>
</div>

<!-- 범례 -->
<div class="legend">
  <div class="leg-item">
    <div class="leg-dot" style="background:var(--duty-bg);border:1px solid #90caf9;"></div> 당직(평일)
  </div>
  <div class="leg-item">
    <div class="leg-dot" style="background:var(--am-bg);border:1px solid #64b5f6;"></div> 오전당직(휴일)
  </div>
  <div class="leg-item">
    <div class="leg-dot" style="background:var(--pm-bg);border:1px solid #42a5f5;"></div> 오후당직(휴일)
  </div>
  <div class="leg-item">
    <div class="leg-dot" style="background:var(--lunch-bg);border:1px solid #ffe082;"></div> 점심
  </div>
  <div class="leg-item">
    <div class="leg-dot" style="background:var(--early-bg);border:1px solid #ce93d8;"></div> 조기출근
  </div>
  <div class="leg-item">
    <div class="leg-dot" style="background:var(--mine-bg);border:2px solid var(--mine-bdr);"></div> 내 일정
  </div>
</div>

<script type="module">
// =============================================================
// ===== 설정 블록 — 운영자가 수정하는 곳 =====
// =============================================================

// [Phase 2에서 채울 것] Firebase 웹 앱 설정값
// Firebase 콘솔 > 프로젝트 설정 > 내 앱 > firebaseConfig 에서 복사
const FIREBASE_CONFIG = {
  apiKey:            'AIzaSyCkHKOpGKjDQW-oANEiLb6iBaArfU-pNU4',
  authDomain:        'duty-calendar-d4058.firebaseapp.com',
  projectId:         'duty-calendar-d4058',
  storageBucket:     'duty-calendar-d4058.firebasestorage.app',
  messagingSenderId: '680660918858',
  appId:             '1:680660918858:web:ccecce47547c10f5c2fcb3',
};

// [Phase 4에서 채울 것] 사이트 공용 비밀번호
const SITE_PASSWORD = '';

// 초기 인원 명단 (실제 이름으로 바꾸세요)
// - from        : 이 명단이 적용되기 시작하는 날짜 (YYYY-MM-DD)
// - members     : 순서대로 나열된 인원 (이 순서가 당직 순번)
// - dutyStartName : from 날짜에 첫 번째 당직을 맡는 사람 이름
// - earlyStartName: 조기출근 첫 주 담당자 (생략하면 members[0])
const DEFAULT_SEGMENTS = [
  {
    from: '2026-06-01',
    members: ['홍길동', '김영희', '이철수', '박지수', '최민준'],
    dutyStartName: '홍길동',
    earlyStartName: '홍길동',
  },
];

// =============================================================
// ===== 2026년 공휴일 (대체공휴일 포함) =====
// 날짜: '이름' 형식. 필요하면 아래에 직접 추가 가능.
// =============================================================
const HOLIDAYS_BASE = {
  '2026-01-01': '신정',
  '2026-02-16': '설날 연휴',
  '2026-02-17': '설날',
  '2026-02-18': '설날 연휴',
  '2026-03-01': '삼일절',
  '2026-03-02': '대체공휴일(삼일절)',
  '2026-05-01': '근로자의 날',
  '2026-05-05': '어린이날',
  '2026-05-24': '부처님오신날',
  '2026-05-25': '대체공휴일(부처님오신날)',
  '2026-06-03': '지방선거일',
  '2026-06-06': '현충일',
  '2026-07-17': '제헌절',
  '2026-08-15': '광복절',
  '2026-08-17': '대체공휴일(광복절)',
  '2026-09-24': '추석 연휴',
  '2026-09-25': '추석',
  '2026-09-26': '추석 연휴',
  '2026-10-03': '개천절',
  '2026-10-05': '대체공휴일(개천절)',
  '2026-10-09': '한글날',
  '2026-12-25': '성탄절',
};

// =============================================================
// ===== 앱 상태 (Phase 2에서 Firestore로 교체) =====
// =============================================================
let appState = {
  segments:           DEFAULT_SEGMENTS,
  overrides:          {},  // 당직 override  키: "YYYY-MM-DD__D|AM|PM"
  lunchOverrides:     {},  // 점심 override  키: "YYYY-MM-DD__L"
  earlyOverrides:     {},  // 조기 override  키: "YYYY-MM-DD__E"
  earlyIncludeWeekend: false,
  holidayAdds:        {},  // 추가 공휴일  { 'YYYY-MM-DD': '이름' }
  holidayRemoves:     [],  // 제거 공휴일  ['YYYY-MM-DD', ...]
  logs:               [],
};

// =============================================================
// ===== 날짜 유틸리티 =====
// =============================================================

// 날짜 문자열을 UTC 기준 정수 일련번호로 변환 (시간대 혼동 방지)
function dayNum(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return Date.UTC(y, m - 1, d) / 86400000;
}

// UTC 정수 일련번호를 YYYY-MM-DD 문자열로 변환
function numToStr(n) {
  const dt = new Date(n * 86400000);
  const y  = dt.getUTCFullYear();
  const m  = String(dt.getUTCMonth() + 1).padStart(2, '0');
  const d  = String(dt.getUTCDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

// N일 뒤 날짜를 YYYY-MM-DD로 반환
function addDays(dateStr, n) {
  return numToStr(dayNum(dateStr) + n);
}

// 오늘 날짜를 YYYY-MM-DD로 반환 (로컬 시각 기준)
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 해당 날짜의 요일 반환 (0=일, 1=월, ..., 6=토) — UTC 기준
function getDow(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
}

// =============================================================
// ===== 공휴일 유틸리티 (holidayAdds / holidayRemoves 반영) =====
// =============================================================

// 날짜의 공휴일 이름을 반환 (없으면 null)
// holidayRemoves에 있으면 공휴일 취소, holidayAdds에 있으면 추가된 공휴일
function getHolidayName(dateStr) {
  if (appState.holidayRemoves.includes(dateStr)) return null;
  if (appState.holidayAdds[dateStr])             return appState.holidayAdds[dateStr];
  return HOLIDAYS_BASE[dateStr] || null;
}

// 공휴일 또는 주말 여부 (당직 2인 배정 조건)
function isHolidayOrWeekend(dateStr) {
  const dow = getDow(dateStr);
  return dow === 0 || dow === 6 || !!getHolidayName(dateStr);
}

// 근무일(평일이면서 공휴일 아닌 날) 여부
function isWorkday(dateStr) {
  return !isHolidayOrWeekend(dateStr);
}

// =============================================================
// ===== 세그먼트 유틸리티 =====
// =============================================================

// 날짜 D에 적용되는 세그먼트를 찾는다 (from ≤ D인 것 중 가장 최근)
function getSegment(dateStr) {
  const list = appState.segments
    .filter(s => s.from <= dateStr)
    .sort((a, b) => b.from.localeCompare(a.from));
  return list[0] || null;
}

// =============================================================
// ===== 당직 계산 (CLAUDE.md 4-1) =====
// =============================================================

// 날짜 D의 기본 당직을 계산한다 (override 미반영 순수 계산)
// 반환: 평일 → { D: 이름 }, 휴일/주말 → { AM: 이름, PM: 이름 }, 계산 불가 → null
function calcDutyBase(dateStr) {
  const seg = getSegment(dateStr);
  if (!seg || seg.members.length === 0) return null;

  const n        = seg.members.length;
  const startIdx = seg.members.indexOf(seg.dutyStartName);
  if (startIdx === -1) return null;

  // 세그먼트 from부터 dateStr 직전까지 배정 슬롯 수를 누적한다
  // 평일 = 1슬롯, 주말/공휴일 = 2슬롯
  let slotIdx = 0;
  let cur = seg.from;
  while (cur < dateStr) {
    slotIdx += isHolidayOrWeekend(cur) ? 2 : 1;
    cur = addDays(cur, 1);
  }

  const baseIdx = (startIdx + slotIdx) % n;

  if (isHolidayOrWeekend(dateStr)) {
    // 주말/공휴일: 오전·오후 2인 배정
    return {
      AM: seg.members[baseIdx],
      PM: seg.members[(baseIdx + 1) % n],
    };
  } else {
    // 평일: 1인 배정
    return { D: seg.members[baseIdx] };
  }
}

// 날짜 D의 override가 반영된 당직을 반환한다
function getDuty(dateStr) {
  const base = calcDutyBase(dateStr);
  if (!base) return null;

  const result = { ...base };
  const pfx    = `${dateStr}__`;

  // 저장된 override가 있으면 덮어쓴다
  if (appState.overrides[pfx + 'D'])  result.D  = appState.overrides[pfx + 'D'];
  if (appState.overrides[pfx + 'AM']) result.AM = appState.overrides[pfx + 'AM'];
  if (appState.overrides[pfx + 'PM']) result.PM = appState.overrides[pfx + 'PM'];

  return result;
}

// =============================================================
// ===== 점심 계산 (CLAUDE.md 4-2) =====
// =============================================================

// 날짜 D의 점심 담당자와 고정 여부를 반환한다 (근무일에만 존재)
// 반환: { name: 이름, fixed: true|false } 또는 null
function getLunch(dateStr) {
  if (!isWorkday(dateStr)) return null;

  const overrideKey = `${dateStr}__L`;

  // 1) 점심 override가 있으면 최우선 적용 (고정 상태)
  if (appState.lunchOverrides[overrideKey]) {
    return { name: appState.lunchOverrides[overrideKey], fixed: true };
  }

  // 2) 다음날 당직(override 반영)의 대표자를 따라간다
  const nextDate = addDays(dateStr, 1);
  const nextDuty = getDuty(nextDate);
  if (!nextDuty) return null;

  // 다음날이 평일이면 D 담당, 주말/공휴일이면 AM 담당
  const name = isHolidayOrWeekend(nextDate) ? nextDuty.AM : nextDuty.D;
  if (!name) return null;

  return { name, fixed: false };
}

// =============================================================
// ===== 조기출근 계산 (CLAUDE.md 4-3) =====
// =============================================================

// 날짜가 속한 주의 월요일 dayNum을 반환한다 (UTC 기준)
function getMondayNum(dateStr) {
  const dn  = dayNum(dateStr);
  const dow = getDow(dateStr); // 0=일, 1=월, ..., 6=토
  const daysFromMon = dow === 0 ? 6 : dow - 1; // 일요일은 6일 뒤가 다음 월요일 아닌, 이전 월요일까지 6일
  return dn - daysFromMon;
}

// 날짜 D의 조기출근 담당자를 반환한다 (없으면 null)
function getEarly(dateStr) {
  // 기본: 근무일에만 표시 (설정에서 주말 포함 가능)
  if (!isWorkday(dateStr) && !appState.earlyIncludeWeekend) return null;

  // override 확인
  const overrideKey = `${dateStr}__E`;
  if (appState.earlyOverrides[overrideKey]) return appState.earlyOverrides[overrideKey];

  const seg = getSegment(dateStr);
  if (!seg || seg.members.length === 0) return null;

  const n              = seg.members.length;
  const earlyStartName = seg.earlyStartName || seg.members[0];
  const earlyStartIdx  = seg.members.indexOf(earlyStartName);
  if (earlyStartIdx === -1) return null;

  // 주차 인덱스: (이번 주 월요일 dayNum − 세그먼트 from주 월요일 dayNum) / 7
  const thisMon    = getMondayNum(dateStr);
  const fromMon    = getMondayNum(seg.from);
  const weekIndex  = Math.floor((thisMon - fromMon) / 7);

  return seg.members[(earlyStartIdx + weekIndex) % n];
}

// =============================================================
// ===== 달력 렌더링 =====
// =============================================================

let viewYear  = new Date().getFullYear();
let viewMonth = new Date().getMonth() + 1; // 1~12
let activeTab = 'duty'; // 'duty' | 'early'
let myName    = localStorage.getItem('dutycal_me') || '';

// Firebase 관련 변수 (Phase 2에서 initFirebase()가 채운다)
let isFirestoreMode = false; // Firestore 연결 성공 시 true
let fsDocRef        = null;  // Firestore 문서 참조 (dutyCalendar/state)
let _updateDoc      = null;  // firebase/firestore updateDoc 함수
let _deleteField    = null;  // firebase/firestore deleteField 함수
let _arrayUnion     = null;  // firebase/firestore arrayUnion 함수

// 월 제목을 갱신한다
function updateTitle() {
  document.getElementById('month-title').textContent = `${viewYear}년 ${viewMonth}월`;
}

// 달력 전체를 다시 그린다
function renderCalendar() {
  try {
    updateTitle();
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';

    // 탭에 따라 cal-wrap에 클래스를 토글해 셀 높이를 조절
    document.getElementById('cal-wrap').classList.toggle('early-tab', activeTab === 'early');

    const firstDateStr = `${viewYear}-${String(viewMonth).padStart(2,'0')}-01`;
    const daysInMonth  = new Date(viewYear, viewMonth, 0).getDate();
    const firstDow     = getDow(firstDateStr); // 0=일 → 그만큼 앞을 빈칸으로
    const today        = todayStr();

    // 첫 주 앞부분 빈 칸
    for (let i = 0; i < firstDow; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      grid.appendChild(empty);
    }

    // 날짜별 셀 생성
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = `${viewYear}-${String(viewMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      grid.appendChild(buildCell(ds, today));
    }
  } catch (e) {
    showError('달력 표시 중 오류가 발생했습니다: ' + e.message);
  }
}

// 날짜 셀 DOM 요소를 만들어 반환한다
function buildCell(dateStr, today) {
  const cell       = document.createElement('div');
  const dow        = getDow(dateStr);
  const holName    = getHolidayName(dateStr);
  const isSat      = dow === 6;
  const isSun      = dow === 0;
  const isHol      = !!holName;
  const isToday    = dateStr === today;

  // 기본 클래스
  const classes = ['day-cell'];
  if (isSat)    classes.push('is-sat');
  if (isSun)    classes.push('is-sun');
  if (isHol)    classes.push('is-holiday'); // CSS 선언 순서(is-sat→is-sun→is-holiday)로 공휴일 색이 우선
  if (isToday)  classes.push('is-today');

  // 탭별 내용 구성
  if (activeTab === 'duty') {
    buildDutyContent(cell, dateStr, holName, isToday, classes);
  } else {
    buildEarlyContent(cell, dateStr, holName, isToday, classes);
  }

  cell.className = classes.join(' ');
  return cell;
}

// 당직·점심 탭의 셀 내용을 채운다
function buildDutyContent(cell, dateStr, holName, isToday, classes) {
  const duty  = getDuty(dateStr);
  const lunch = getLunch(dateStr);

  // 내 일정인지 확인 (내 이름이 당직 또는 점심에 있으면 강조)
  const myInDuty  = myName && duty  && (duty.D === myName || duty.AM === myName || duty.PM === myName);
  const myInLunch = myName && lunch && lunch.name === myName;
  if (myInDuty || myInLunch) classes.push('is-mine');

  cell.appendChild(makeDateNum(dateStr, isToday));
  if (holName) cell.appendChild(makeHolName(holName));

  if (duty) {
    if (duty.D !== undefined) {
      // 평일 당직 1인
      appendSlot(cell, '당직', duty.D, 'slot-duty');
    } else {
      // 주말/공휴일 2인
      appendSlot(cell, '오전', duty.AM, 'slot-am');
      appendSlot(cell, '오후', duty.PM, 'slot-pm');
    }
  }

  // 점심: 따라감(↓) 또는 고정(📌) 표시
  if (lunch) {
    const lunchLabel = lunch.fixed ? `점심📌 ${lunch.name}` : `점심↓ ${lunch.name}`;
    const isMine     = myName && lunch.name === myName;
    const el         = document.createElement('span');
    el.className     = `slot ${isMine ? 'slot-mine' : 'slot-lunch'}`;
    el.textContent   = lunchLabel;
    cell.appendChild(el);
  }
}

// 조기출근 탭의 셀 내용을 채운다
function buildEarlyContent(cell, dateStr, holName, isToday, classes) {
  const early = getEarly(dateStr);
  if (myName && early === myName) classes.push('is-mine');

  cell.appendChild(makeDateNum(dateStr, isToday));
  if (holName) cell.appendChild(makeHolName(holName));
  if (early) appendSlot(cell, '조기', early, 'slot-early');
}

// 날짜 숫자 요소를 만든다
function makeDateNum(dateStr, isToday) {
  const el = document.createElement('div');
  el.className = 'd-num';
  // 날짜 숫자 (앞 0 제거)
  el.textContent = String(parseInt(dateStr.split('-')[2], 10));
  if (isToday) {
    const dot = document.createElement('span');
    dot.className = 'today-dot';
    el.appendChild(dot);
  }
  return el;
}

// 공휴일 이름 요소를 만든다
function makeHolName(name) {
  const el = document.createElement('div');
  el.className   = 'hol-name';
  el.textContent = name;
  return el;
}

// 배정 배지를 생성해 부모에 붙인다 (name이 없으면 건너뜀)
function appendSlot(parent, label, name, colorClass) {
  if (!name) return; // null/undefined 방어
  const isMine = myName && name === myName;
  const el     = document.createElement('span');
  el.className = `slot ${isMine ? 'slot-mine' : colorClass}`;
  el.textContent = `${label} ${name}`;
  parent.appendChild(el);
}

// =============================================================
// ===== 공휴일 관리 (로컬 저장 + Firestore 연동) =====
// =============================================================

// 로컬에 저장된 추가 공휴일을 appState에 불러온다 (Phase 2 이전 fallback)
function loadLocalHolidays() {
  try {
    const raw = localStorage.getItem('dutycal_holidays');
    if (!raw) return;
    const saved = JSON.parse(raw);
    appState.holidayAdds    = saved.adds    || {};
    appState.holidayRemoves = saved.removes || [];
  } catch (_) { /* 손상된 캐시 무시 */ }
}

// 추가 공휴일을 로컬에 저장한다 (Firestore 미연결 시 사용)
function saveLocalHolidays() {
  localStorage.setItem('dutycal_holidays', JSON.stringify({
    adds:    appState.holidayAdds,
    removes: appState.holidayRemoves,
  }));
}

// 공휴일 추가 버튼 핸들러 — 날짜·이름을 받아 holidayAdds에 기록
window.addCustomHoliday = async function () {
  const dateInput = document.getElementById('hol-date-input');
  const nameInput = document.getElementById('hol-name-input');
  const dateStr   = dateInput.value;
  const name      = nameInput.value.trim();

  if (!dateStr || !name) {
    alert('날짜와 공휴일 이름을 모두 입력해주세요.');
    return;
  }

  appState.holidayAdds[dateStr] = name;

  if (isFirestoreMode && fsDocRef && _updateDoc) {
    try {
      // 필드 단위 업데이트 (맵의 한 항목만 추가, 다른 날짜 덮어쓰지 않음)
      await _updateDoc(fsDocRef, { [`holidayAdds.${dateStr}`]: name });
    } catch (e) { showError('공휴일 저장 오류: ' + e.message); }
  } else {
    saveLocalHolidays();
  }

  dateInput.value = '';
  nameInput.value = '';
  renderHolidayList();
  renderCalendar();
};

// 공휴일 삭제 버튼 핸들러 — holidayAdds에서 해당 날짜 항목 제거
window.deleteCustomHoliday = async function (dateStr) {
  delete appState.holidayAdds[dateStr];

  if (isFirestoreMode && fsDocRef && _updateDoc && _deleteField) {
    try {
      // deleteField()로 맵의 특정 키만 삭제
      await _updateDoc(fsDocRef, { [`holidayAdds.${dateStr}`]: _deleteField() });
    } catch (e) { showError('공휴일 삭제 오류: ' + e.message); }
  } else {
    saveLocalHolidays();
  }

  renderHolidayList();
  renderCalendar();
};

// 추가된 공휴일 목록을 패널 안에 렌더링한다
function renderHolidayList() {
  const container = document.getElementById('custom-hol-list');
  const adds      = appState.holidayAdds;
  const dates     = Object.keys(adds).sort();

  if (dates.length === 0) {
    container.innerHTML = '<div class="hol-empty">추가된 공휴일이 없습니다.</div>';
    return;
  }

  container.innerHTML = '';
  const list = document.createElement('div');
  list.className = 'hol-list';

  for (const d of dates) {
    const item = document.createElement('div');
    item.className = 'hol-item';
    // 날짜를 data 속성에 두어 XSS 없이 onclick에서 참조
    item.innerHTML = `
      <span class="hol-item-info">
        <span class="hol-item-date">${d}</span>${adds[d]}
      </span>
      <button class="hol-del-btn" data-date="${d}" onclick="deleteCustomHoliday(this.dataset.date)">삭제</button>
    `;
    list.appendChild(item);
  }
  container.appendChild(list);
}

// 설정 패널 열기/닫기 토글
window.toggleSettings = function () {
  document.getElementById('settings-panel').classList.toggle('open');
};

// =============================================================
// ===== Firebase 초기화 및 실시간 구독 (Phase 2) =====
// =============================================================

// FIREBASE_CONFIG가 설정되어 있으면 Firestore 실시간 모드로 전환한다
async function initFirebase() {
  if (!FIREBASE_CONFIG) return; // 설정 전: 로컬 모드 유지

  try {
    // Firebase SDK를 gstatic CDN에서 동적으로 불러온다 (빌드 단계 없이 사용)
    // 버전을 바꾸려면 아래 URL의 숫자 부분만 수정하세요
    const { initializeApp } = await import(
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'
    );
    const {
      getFirestore, doc, onSnapshot,
      setDoc, updateDoc, deleteField, arrayUnion,
    } = await import(
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'
    );
    const { getAuth, signInAnonymously } = await import(
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'
    );

    // 모듈 스코프 변수에 저장 — 다른 함수(공휴일 추가·삭제 등)에서 사용
    _updateDoc   = updateDoc;
    _deleteField = deleteField;
    _arrayUnion  = arrayUnion;

    const app  = initializeApp(FIREBASE_CONFIG);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    // 익명 로그인 (가입 없이 Firestore 규칙 통과용)
    await signInAnonymously(auth);

    fsDocRef = doc(db, 'dutyCalendar', 'state');

    // 실시간 구독: 문서가 바뀌면 appState를 교체하고 화면을 다시 그린다
    onSnapshot(fsDocRef, async (snap) => {
      if (!snap.exists()) {
        // 최초 실행: 기본값으로 문서 생성 (setDoc 후 onSnapshot이 재호출됨)
        await setDoc(fsDocRef, {
          segments:            DEFAULT_SEGMENTS,
          overrides:           {},
          lunchOverrides:      {},
          earlyOverrides:      {},
          earlyIncludeWeekend: false,
          holidayAdds:         {},
          holidayRemoves:      [],
          logs:                [],
        });
        return;
      }

      const data = snap.data();
      // Firestore 데이터로 appState를 완전히 교체한다
      appState = {
        segments:            data.segments            || DEFAULT_SEGMENTS,
        overrides:           data.overrides           || {},
        lunchOverrides:      data.lunchOverrides      || {},
        earlyOverrides:      data.earlyOverrides      || {},
        earlyIncludeWeekend: data.earlyIncludeWeekend ?? false,
        holidayAdds:         data.holidayAdds         || {},
        holidayRemoves:      data.holidayRemoves       || [],
        logs:                data.logs               || [],
      };

      isFirestoreMode = true;
      document.getElementById('sync-status').textContent = '🟢 실시간 연결됨';
      renderCalendar();
      renderHolidayList();
    }, (err) => {
      showError('Firestore 연결 오류: ' + err.message);
    });

  } catch (e) {
    showError('Firebase 초기화 오류: ' + e.message);
    // 오류 시 로컬 모드 유지 (isFirestoreMode = false)
  }
}

// =============================================================
// ===== 탭 전환 =====
// =============================================================

// onclick에서 호출하므로 window에 노출 (module scope 우회)
window.switchTab = function (tab) {
  activeTab = tab;
  document.getElementById('tab-duty') .classList.toggle('active', tab === 'duty');
  document.getElementById('tab-early').classList.toggle('active', tab === 'early');
  renderCalendar();
};

// =============================================================
// ===== 오류 표시 =====
// =============================================================

// 화면 상단에 짧은 오류 안내를 표시한다
function showError(msg) {
  const bar = document.getElementById('error-bar');
  bar.textContent = '⚠ ' + msg;
  bar.classList.add('show');
}

// =============================================================
// ===== 이벤트 바인딩 =====
// =============================================================

// 이전 달 버튼
document.getElementById('btn-prev').addEventListener('click', () => {
  viewMonth--;
  if (viewMonth < 1) { viewMonth = 12; viewYear--; }
  renderCalendar();
});

// 다음 달 버튼
document.getElementById('btn-next').addEventListener('click', () => {
  viewMonth++;
  if (viewMonth > 12) { viewMonth = 1; viewYear++; }
  renderCalendar();
});

// 오늘 버튼
document.getElementById('btn-today').addEventListener('click', () => {
  const d = new Date();
  viewYear  = d.getFullYear();
  viewMonth = d.getMonth() + 1;
  renderCalendar();
});

// 내 이름 입력 → localStorage 저장 후 달력 갱신
const nameInput = document.getElementById('my-name-input');
nameInput.value = myName;
nameInput.addEventListener('input', () => {
  myName = nameInput.value.trim();
  localStorage.setItem('dutycal_me', myName);
  renderCalendar();
});

// =============================================================
// ===== 초기화 =====
// =============================================================
loadLocalHolidays(); // 로컬에 저장된 추가 공휴일을 먼저 불러온다
renderCalendar();
renderHolidayList();
initFirebase();      // FIREBASE_CONFIG가 있으면 실시간 모드로 전환

</script>
