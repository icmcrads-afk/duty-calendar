<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방사선과 당직표</title>
  <style>
    /* ===== 전역 리셋 ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== 색상·크기 변수 ===== */
    :root {
      --bg:          #f4f6f9;
      --surface:     #ffffff;
      --border:      #d8dde5;
      --text:        #1a1d23;
      --muted:       #6b7280;
      --primary:     #1565c0;
      --primary-dk:  #0d47a1;

      --today-bg:    #fffde7;
      --today-bdr:   #f9a825;

      --sat-bg:      #e3f2fd;
      --sat-txt:     #1565c0;
      --hol-bg:      #ffebee;
      --hol-txt:     #b71c1c;

      --mine-bg:     #e8f5e9;
      --mine-bdr:    #43a047;

      --duty-bg:     #e3f2fd;
      --duty-txt:    #0d47a1;
      --am-bg:       #bbdefb;
      --am-txt:      #0d47a1;
      --pm-bg:       #90caf9;
      --pm-txt:      #0d3c87;
      --lunch-bg:    #fff8e1;
      --lunch-txt:   #e65100;
      --early-bg:    #f3e5f5;
      --early-txt:   #6a1b9a;

      --radius:      8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== 상단 헤더 ===== */
    .app-header {
      background: var(--primary);
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .app-header h1 { font-size: 1rem; font-weight: 700; }
    #sync-status { font-size: 0.78rem; opacity: 0.85; }

    /* ===== 내 이름 설정 바 ===== */
    .name-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 7px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .name-bar label { color: var(--text); font-weight: 600; white-space: nowrap; }
    .name-bar input {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.82rem;
      width: 90px;
    }

    /* ===== 오류 알림 바 ===== */
    .error-bar {
      background: #ffebee;
      color: #b71c1c;
      padding: 7px 16px;
      font-size: 0.82rem;
      display: none;
    }
    .error-bar.show { display: block; }

    /* ===== 월 네비게이션 ===== */
    .month-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .month-nav button {
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 11px;
      cursor: pointer;
      font-size: 0.88rem;
      color: var(--text);
    }
    .month-nav button:hover { background: var(--bg); }
    #month-title { font-size: 1.1rem; font-weight: 700; min-width: 110px; text-align: center; }

    /* ===== 탭 버튼 ===== */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 9px 4px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.88rem;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      font-family: inherit;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 700;
    }

    /* ===== 달력 래퍼 ===== */
    .cal-wrap { padding: 10px; max-width: 960px; margin: 0 auto; }

    /* ===== 요일 헤더 행 ===== */
    .dow-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-bottom: 3px;
    }
    .dow-cell {
      text-align: center;
      font-size: 0.73rem;
      font-weight: 700;
      padding: 3px 0;
      color: var(--muted);
    }
    .dow-cell.sun { color: var(--hol-txt); }
    .dow-cell.sat { color: var(--sat-txt); }

    /* ===== 달력 그리드 ===== */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    /* ===== 날짜 셀 ===== */
    .day-cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px;
      min-height: 82px;
      overflow: hidden;
    }
    .day-cell.empty      { background: transparent; border-color: transparent; }
    .day-cell.is-sat     { background: var(--sat-bg); }
    .day-cell.is-sun     { background: var(--hol-bg); }
    .day-cell.is-holiday { background: var(--hol-bg); }
    .day-cell.is-today   { background: var(--today-bg); border-color: var(--today-bdr); border-width: 2px; }
    .day-cell.is-mine    { border-color: var(--mine-bdr); border-width: 2px; }

    /* 날짜 숫자 */
    .d-num {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .is-sat .d-num     { color: var(--sat-txt); }
    .is-sun .d-num     { color: var(--hol-txt); }
    .is-holiday .d-num { color: var(--hol-txt); }

    /* 오늘 표시 점 */
    .today-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--today-bdr);
      border-radius: 50%;
      margin-left: 3px;
      vertical-align: middle;
    }

    /* 공휴일 이름 */
    .hol-name {
      font-size: 0.62rem;
      color: var(--hol-txt);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== 배정 배지(슬롯) ===== */
    .slot {
      display: block;
      border-radius: 3px;
      padding: 1px 4px;
      margin-top: 2px;
      font-size: 0.70rem;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slot-duty  { background: var(--duty-bg);  color: var(--duty-txt); }
    .slot-am    { background: var(--am-bg);    color: var(--am-txt); }
    .slot-pm    { background: var(--pm-bg);    color: var(--pm-txt); }
    .slot-lunch { background: var(--lunch-bg); color: var(--lunch-txt); }
    .slot-early { background: var(--early-bg); color: var(--early-txt); }
    .slot-mine  { font-weight: 700; background: var(--mine-bg); color: #2e7d32; }

    /* 조기출근 탭 셀은 높이를 좀 더 줄임 */
    .early-tab .day-cell { min-height: 58px; }

    /* ===== 범례 ===== */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 10px 10px 14px;
      max-width: 960px;
      margin: 0 auto;
      font-size: 0.74rem;
      color: var(--muted);
    }
    .leg-item { display: flex; align-items: center; gap: 4px; }
    .leg-dot {
      width: 11px; height: 11px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ===== 설정 패널 (공휴일 관리) ===== */
    .settings-panel {
      display: none;
      background: #f0f4ff;
      border-bottom: 2px solid var(--primary);
      padding: 12px 16px;
    }
    .settings-panel.open { display: block; }
    .settings-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-dk);
      margin-bottom: 6px;
    }
    .settings-desc { font-size: 0.76rem; color: var(--muted); margin-bottom: 8px; }
    .settings-form {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }
    .settings-form input {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 0.82rem;
      font-family: inherit;
      background: #fff;
    }
    .settings-form input[type="date"] { width: 138px; }
    .settings-form input[type="text"] { flex: 1; min-width: 100px; }
    .settings-form button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 5px 14px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      white-space: nowrap;
    }
    .settings-form button:hover { background: var(--primary-dk); }
    .hol-list { display: flex; flex-direction: column; gap: 4px; }
    .hol-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.80rem;
    }
    .hol-item-info { flex: 1; }
    .hol-item-date { font-weight: 700; color: var(--primary-dk); margin-right: 6px; }
    .hol-del-btn {
      background: none;
      border: 1px solid #ef5350;
      border-radius: 3px;
      color: #c62828;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 0.74rem;
      font-family: inherit;
    }
    .hol-del-btn:hover { background: #ffebee; }
    .hol-empty { font-size: 0.78rem; color: var(--muted); font-style: italic; }

    /* ===== 모달 오버레이 ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: var(--surface); border-radius: var(--radius);
      padding: 18px; width: min(94vw, 420px);
      max-height: 85vh; overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.22);
    }
    .modal-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .modal-head h3 { font-size: 0.95rem; color: var(--primary); }
    .modal-close-btn {
      background: none; border: none; font-size: 1.3rem;
      cursor: pointer; color: var(--muted); line-height: 1; padding: 0 4px;
    }
    .modal-slot-row {
      display: flex; align-items: center; gap: 5px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .modal-slot-label {
      font-size: 0.73rem; font-weight: 700; color: var(--muted); min-width: 42px;
    }
    .modal-slot-name { font-size: 0.85rem; font-weight: 700; flex: 1; min-width: 50px; }
    .modal-select {
      font-size: 0.76rem; padding: 3px 4px; border: 1px solid var(--border);
      border-radius: 4px; font-family: inherit;
    }
    .modal-btn {
      font-size: 0.71rem; padding: 3px 7px; border-radius: 4px;
      cursor: pointer; font-family: inherit;
      border: 1px solid var(--border); background: var(--surface);
      white-space: nowrap;
    }
    .modal-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .modal-btn.danger  { background: #ffebee; color: #b71c1c; border-color: #ef9a9a; }
    .modal-swap-area {
      width: 100%; margin-top: 6px; padding: 8px;
      background: #f4f6f9; border-radius: 4px; display: none;
    }
    .modal-swap-area.open { display: block; }
    .modal-swap-area label { font-size: 0.73rem; color: var(--muted); display: block; margin-bottom: 5px; }
    .modal-swap-row { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .modal-swap-row input, .modal-swap-row select {
      font-size: 0.76rem; padding: 3px 5px; border: 1px solid var(--border);
      border-radius: 4px; font-family: inherit;
    }

    /* ===== 변경 내역 탭 ===== */
    #logs-view { padding: 10px 14px; max-width: 700px; margin: 0 auto; }
    .log-item {
      display: flex; gap: 8px; align-items: flex-start;
      padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.79rem;
    }
    .log-tag {
      font-size: 0.67rem; padding: 2px 7px; border-radius: 10px;
      font-weight: 700; white-space: nowrap; align-self: center;
    }
    .log-tag.duty  { background: var(--duty-bg);  color: var(--duty-txt); }
    .log-tag.lunch { background: var(--lunch-bg); color: var(--lunch-txt); }
    .log-tag.early { background: var(--early-bg); color: var(--early-txt); }
    .log-tag.swap  { background: #e8f5e9; color: #1b5e20; }
    .log-tag.seg   { background: #e8eaf6; color: #283593; }
    .log-body { flex: 1; line-height: 1.6; }
    .log-time { font-size: 0.70rem; color: var(--muted); white-space: nowrap; align-self: center; }
    .log-empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 0.85rem; }

    /* ===== 설정 패널 확장: 인원 관리 / 조기 설정 / 통계 ===== */
    .settings-section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
    .settings-section-title { font-weight: 700; margin-bottom: 8px; font-size: 0.85rem; }
    .seg-item {
      background: #f4f6f9; border-radius: 5px; padding: 8px 11px;
      margin-bottom: 6px; font-size: 0.79rem;
    }
    .seg-item-head {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px;
    }
    .seg-from { font-weight: 700; color: var(--primary); }
    .seg-members { color: var(--muted); font-size: 0.73rem; margin-top: 2px; }
    .seg-del-btn {
      background: #ffebee; border: 1px solid #ef9a9a; color: #b71c1c;
      border-radius: 4px; padding: 2px 8px; cursor: pointer;
      font-size: 0.70rem; font-family: inherit;
    }
    .seg-add-form { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
    .seg-add-form input {
      font-size: 0.79rem; padding: 5px 8px; border: 1px solid var(--border);
      border-radius: 4px; font-family: inherit;
    }
    .seg-add-form button {
      font-size: 0.79rem; padding: 5px 12px; border-radius: 4px; cursor: pointer;
      background: var(--primary); color: #fff; border: none; font-family: inherit; align-self: flex-start;
    }
    .stats-toggle { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; }
    .stats-toggle input { cursor: pointer; }
    .stats-table {
      width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 8px;
    }
    .stats-table th, .stats-table td {
      border: 1px solid var(--border); padding: 5px 8px; text-align: center;
    }
    .stats-table th { background: #f0f4f8; font-weight: 700; }

    /* ===== 모바일 반응형 ===== */
    @media (max-width: 500px) {
      .day-cell  { min-height: 60px; padding: 3px; }
      .d-num     { font-size: 0.78rem; }
      .slot      { font-size: 0.62rem; padding: 1px 2px; }
      .hol-name  { font-size: 0.58rem; }
      .cal-wrap  { padding: 5px; }
    }
  </style>
</head>
<body>

<!-- 상단 헤더 -->
<header class="app-header">
  <h1>방사선과 당직표</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <button onclick="toggleSettings()"
      style="background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.35);border-radius:5px;padding:4px 11px;cursor:pointer;color:#fff;font-size:0.80rem;font-family:inherit;">
      ⚙ 설정
    </button>
    <span id="sync-status">로컬 모드</span>
  </div>
</header>

<!-- 내 이름 설정 (내 일정 강조용 — localStorage에만 저장) -->
<div class="name-bar">
  <label for="my-name-input">내 이름:</label>
  <input type="text" id="my-name-input" placeholder="이름 입력" maxlength="10" autocomplete="off">
  <span>← 입력하면 내 일정이 초록 테두리로 강조됩니다</span>
</div>

<!-- 설정 패널 (헤더 버튼으로 열고 닫음) -->
<div class="settings-panel" id="settings-panel">

  <!-- 공휴일 관리 -->
  <div class="settings-title">임시 공휴일 추가</div>
  <p class="settings-desc">예상치 못한 휴일(임시공휴일 등)을 추가합니다. 추가된 날은 공휴일로 처리됩니다.</p>
  <div class="settings-form">
    <input type="date" id="hol-date-input">
    <input type="text" id="hol-name-input" placeholder="공휴일 이름 (예: 임시공휴일)" maxlength="20">
    <button onclick="addCustomHoliday()">추가</button>
  </div>
  <div id="custom-hol-list"><div class="hol-empty">추가된 공휴일이 없습니다.</div></div>

  <!-- 인원 관리 (기간별 명단) -->
  <div class="settings-section">
    <div class="settings-section-title">인원 관리 (기간별 명단)</div>
    <p class="settings-desc">인원이 바뀔 때 새 명단을 추가하세요. 그 날부터 새 명단으로 배정됩니다.</p>
    <div id="seg-list"></div>
    <div class="seg-add-form">
      <input type="date"  id="seg-from-input"        placeholder="적용 시작일">
      <input type="text"  id="seg-members-input"     placeholder="인원 (쉼표로 구분, 예: 홍길동,김영희,이철수)" maxlength="200">
      <input type="text"  id="seg-duty-start-input"  placeholder="첫 당직자 이름 (위 인원 중 하나)" maxlength="20">
      <input type="text"  id="seg-early-start-input" placeholder="첫 조기출근자 (빈칸이면 첫 번째 인원)" maxlength="20">
      <button onclick="addSegment()">명단 추가</button>
    </div>
  </div>

  <!-- 조기출근 설정 -->
  <div class="settings-section">
    <div class="settings-section-title">조기출근 설정</div>
    <label class="stats-toggle">
      <input type="checkbox" id="early-weekend-chk" onchange="toggleEarlyWeekend(this.checked)">
      주말·공휴일에도 조기출근 담당자 표시
    </label>
  </div>

  <!-- 이번 달 배정 횟수 -->
  <div class="settings-section">
    <div class="settings-section-title">이번 달 배정 횟수</div>
    <div id="stats-area"></div>
  </div>

</div>

<!-- 동기화/오류 안내 (평소에는 숨김) -->
<div class="error-bar" id="error-bar"></div>

<!-- 월 이동 네비게이션 -->
<div class="month-nav">
  <button id="btn-prev" aria-label="이전 달">◀</button>
  <div id="month-title"></div>
  <button id="btn-next" aria-label="다음 달">▶</button>
  <button id="btn-today">오늘</button>
</div>

<!-- 탭 선택 -->
<div class="tabs">
  <button class="tab-btn active" id="tab-duty"  onclick="switchTab('duty')">당직 · 점심</button>
  <button class="tab-btn"        id="tab-early" onclick="switchTab('early')">조기출근</button>
  <button class="tab-btn"        id="tab-logs"  onclick="switchTab('logs')">변경내역</button>
</div>

<!-- 달력 영역 -->
<div class="cal-wrap" id="cal-wrap">
  <!-- 요일 헤더 -->
  <div class="dow-row">
    <div class="dow-cell sun">일</div>
    <div class="dow-cell">월</div>
    <div class="dow-cell">화</div>
    <div class="dow-cell">수</div>
    <div class="dow-cell">목</div>
    <div class="dow-cell">금</div>
    <div class="dow-cell sat">토</div>
  </div>
  <!-- 날짜 셀은 JS로 채움 -->
  <div class="cal-grid" id="cal-grid"></div>
</div>

<!-- 범례 -->
<div class="legend">
  <div class="leg-item">
    <div class="leg-dot" style="background:var(--duty-bg);border:1px solid #90caf9;"></div> 당직(평일)
  </div>
  <div class="leg-item">
    <div class="leg-dot" style="background:var(--am-bg);border:1px solid #64b5f6;"></div> 오전당직(휴일)
  </div>
  <div class="leg-item">
    <div class="leg-dot" style="background:var(--pm-bg);border:1px solid #42a5f5;"></div> 오후당직(휴일)
  </div>
  <div class="leg-item">
    <div class="leg-dot" style="background:var(--lunch-bg);border:1px solid #ffe082;"></div> 점심
  </div>
  <div class="leg-item">
    <div class="leg-dot" style="background:var(--early-bg);border:1px solid #ce93d8;"></div> 조기출근
  </div>
  <div class="leg-item">

// [Phase 4에서 채울 것] 사이트 공용 비밀번호

// 초기 인원 명단 (실제 이름으로 바꾸세요)

    earlyMembers:  ['김인하', '최민석', '안철경', '김지윤', '최석훈', '김범각', '안재만', '조혜성', '임나영', '최세린'],

// =============================================================
// ===== 2026년 공휴일 (대체공휴일 포함) =====
// 날짜: '이름' 형식. 필요하면 아래에 직접 추가 가능.
// =============================================================
const HOLIDAYS_BASE = {
  '2026-01-01': '신정',
  '2026-02-16': '설날 연휴',
  '2026-02-17': '설날',
  '2026-02-18': '설날 연휴',
  '2026-03-01': '삼일절',
  '2026-03-02': '대체공휴일(삼일절)',
  '2026-05-01': '근로자의 날',
  '2026-05-05': '어린이날',
  '2026-05-24': '부처님오신날',
  '2026-05-25': '대체공휴일(부처님오신날)',
  '2026-06-03': '지방선거일',
  '2026-06-06': '현충일',
  '2026-07-17': '제헌절',
  '2026-08-15': '광복절',
  '2026-08-17': '대체공휴일(광복절)',
  '2026-09-24': '추석 연휴',
  '2026-09-25': '추석',
  '2026-09-26': '추석 연휴',
  '2026-10-03': '개천절',
  '2026-10-05': '대체공휴일(개천절)',
  '2026-10-09': '한글날',
  '2026-12-25': '성탄절',
};

// =============================================================
// ===== 앱 상태 (Phase 2에서 Firestore로 교체) =====
// =============================================================
let appState = {
  segments:           DEFAULT_SEGMENTS,
  overrides:          {},  // 당직 override  키: "YYYY-MM-DD__D|AM|PM"
  lunchOverrides:     {},  // 점심 override  키: "YYYY-MM-DD__L"
  earlyOverrides:     {},  // 조기 override  키: "YYYY-MM-DD__E"
  earlyIncludeWeekend: false,
  holidayAdds:        {},  // 추가 공휴일  { 'YYYY-MM-DD': '이름' }
  holidayRemoves:     [],  // 제거 공휴일  ['YYYY-MM-DD', ...]
  logs:               [],
};

// =============================================================
// ===== 날짜 유틸리티 =====
// =============================================================

// 날짜 문자열을 UTC 기준 정수 일련번호로 변환 (시간대 혼동 방지)
function dayNum(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return Date.UTC(y, m - 1, d) / 86400000;
}

// UTC 정수 일련번호를 YYYY-MM-DD 문자열로 변환
function numToStr(n) {
  const dt = new Date(n * 86400000);
  const y  = dt.getUTCFullYear();
  const m  = String(dt.getUTCMonth() + 1).padStart(2, '0');
  const d  = String(dt.getUTCDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

// N일 뒤 날짜를 YYYY-MM-DD로 반환
function addDays(dateStr, n) {
  return numToStr(dayNum(dateStr) + n);
}

// 오늘 날짜를 YYYY-MM-DD로 반환 (로컬 시각 기준)
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 해당 날짜의 요일 반환 (0=일, 1=월, ..., 6=토) — UTC 기준
function getDow(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
}

// =============================================================
// ===== 공휴일 유틸리티 (holidayAdds / holidayRemoves 반영) =====
// =============================================================

// 날짜의 공휴일 이름을 반환 (없으면 null)
// holidayRemoves에 있으면 공휴일 취소, holidayAdds에 있으면 추가된 공휴일
function getHolidayName(dateStr) {
  if (appState.holidayRemoves.includes(dateStr)) return null;
  if (appState.holidayAdds[dateStr])             return appState.holidayAdds[dateStr];
  return HOLIDAYS_BASE[dateStr] || null;
}

// 공휴일 또는 주말 여부 (당직 2인 배정 조건)
function isHolidayOrWeekend(dateStr) {
  const dow = getDow(dateStr);
  return dow === 0 || dow === 6 || !!getHolidayName(dateStr);
}

// 근무일(평일이면서 공휴일 아닌 날) 여부
function isWorkday(dateStr) {
  return !isHolidayOrWeekend(dateStr);
}

// =============================================================
// ===== 세그먼트 유틸리티 =====
// =============================================================

// 날짜 D에 적용되는 세그먼트를 찾는다 (from ≤ D인 것 중 가장 최근)
function getSegment(dateStr) {
  const list = appState.segments
    .filter(s => s.from <= dateStr)
    .sort((a, b) => b.from.localeCompare(a.from));
  return list[0] || null;
}

// =============================================================
// ===== 당직 계산 (CLAUDE.md 4-1) =====
// =============================================================

// 날짜 D의 기본 당직을 계산한다 (override 미반영 순수 계산)
// 반환: 평일 → { D: 이름 }, 휴일/주말 → { AM: 이름, PM: 이름 }, 계산 불가 → null
function calcDutyBase(dateStr) {
  const seg = getSegment(dateStr);
  if (!seg || seg.members.length === 0) return null;

  const n        = seg.members.length;
  const startIdx = seg.members.indexOf(seg.dutyStartName);
  if (startIdx === -1) return null;

  // 세그먼트 from부터 dateStr 직전까지 배정 슬롯 수를 누적한다
  // 평일 = 1슬롯, 주말/공휴일 = 2슬롯
  let slotIdx = 0;
  let cur = seg.from;
  while (cur < dateStr) {
    slotIdx += isHolidayOrWeekend(cur) ? 2 : 1;
    cur = addDays(cur, 1);
  }

  const baseIdx = (startIdx + slotIdx) % n;

  if (isHolidayOrWeekend(dateStr)) {
    // 주말/공휴일: 오전·오후 2인 배정
    return {
      AM: seg.members[baseIdx],
      PM: seg.members[(baseIdx + 1) % n],
    };
  } else {
    // 평일: 1인 배정
    return { D: seg.members[baseIdx] };
  }
}

// 날짜 D의 override가 반영된 당직을 반환한다
function getDuty(dateStr) {
  const base = calcDutyBase(dateStr);
  if (!base) return null;

  const result = { ...base };
  const pfx    = `${dateStr}__`;

  // 저장된 override가 있으면 덮어쓴다
  if (appState.overrides[pfx + 'D'])  result.D  = appState.overrides[pfx + 'D'];
  if (appState.overrides[pfx + 'AM']) result.AM = appState.overrides[pfx + 'AM'];
  if (appState.overrides[pfx + 'PM']) result.PM = appState.overrides[pfx + 'PM'];

  return result;
}

// =============================================================
// ===== 점심 계산 (CLAUDE.md 4-2) =====
// =============================================================

// 날짜 D의 점심 담당자와 고정 여부를 반환한다 (근무일에만 존재)
// 반환: { name: 이름, fixed: true|false } 또는 null
function getLunch(dateStr) {
  if (!isWorkday(dateStr)) return null;

  const overrideKey = `${dateStr}__L`;

  // 1) 점심 override가 있으면 최우선 적용 (고정 상태)
  if (appState.lunchOverrides[overrideKey]) {
    return { name: appState.lunchOverrides[overrideKey], fixed: true };
  }

  // 2) 다음날 당직(override 반영)의 대표자를 따라간다
  const nextDate = addDays(dateStr, 1);
  const nextDuty = getDuty(nextDate);
  if (!nextDuty) return null;

  // 다음날이 평일이면 D 담당, 주말/공휴일이면 AM 담당
  const name = isHolidayOrWeekend(nextDate) ? nextDuty.AM : nextDuty.D;
  if (!name) return null;

  return { name, fixed: false };
}

// =============================================================
// ===== 조기출근 계산 (CLAUDE.md 4-3) =====
// =============================================================

// 날짜가 속한 주의 월요일 dayNum을 반환한다 (UTC 기준)
function getMondayNum(dateStr) {
  const dn  = dayNum(dateStr);
  const dow = getDow(dateStr); // 0=일, 1=월, ..., 6=토
  const daysFromMon = dow === 0 ? 6 : dow - 1; // 일요일은 6일 뒤가 다음 월요일 아닌, 이전 월요일까지 6일
  return dn - daysFromMon;
}

// 날짜 D의 조기출근 담당자를 반환한다 (없으면 null)
function getEarly(dateStr) {
  // 기본: 근무일에만 표시 (설정에서 주말 포함 가능)
  if (!isWorkday(dateStr) && !appState.earlyIncludeWeekend) return null;

  // override 확인
  const overrideKey = `${dateStr}__E`;
  if (appState.earlyOverrides[overrideKey]) return appState.earlyOverrides[overrideKey];

  const seg = getSegment(dateStr);
  if (!seg || seg.members.length === 0) return null;

  // earlyMembers가 있으면 조기출근 전용 명단, 없으면 당직 명단으로 대체
  const earlyList      = (seg.earlyMembers && seg.earlyMembers.length > 0) ? seg.earlyMembers : seg.members;
  const n              = earlyList.length;
  const earlyStartName = seg.earlyStartName || earlyList[0];
  const earlyStartIdx  = earlyList.indexOf(earlyStartName);
  if (earlyStartIdx === -1) return null;

  // 주차 인덱스: (이번 주 월요일 dayNum − 세그먼트 from주 월요일 dayNum) / 7
  const thisMon    = getMondayNum(dateStr);
  const fromMon    = getMondayNum(seg.from);
  const weekIndex  = Math.floor((thisMon - fromMon) / 7);

  return earlyList[(earlyStartIdx + weekIndex) % n];
}

// =============================================================
// ===== 달력 렌더링 =====
// =============================================================

let viewYear  = new Date().getFullYear();
let viewMonth = new Date().getMonth() + 1; // 1~12
let activeTab = 'duty'; // 'duty' | 'early'
let myName    = localStorage.getItem('dutycal_me') || '';

// Firebase 관련 변수 (Phase 2에서 initFirebase()가 채운다)
let isFirestoreMode = false; // Firestore 연결 성공 시 true
let fsDocRef        = null;  // Firestore 문서 참조 (dutyCalendar/state)
let _updateDoc      = null;  // firebase/firestore updateDoc 함수
let _deleteField    = null;  // firebase/firestore deleteField 함수
let _arrayUnion     = null;  // firebase/firestore arrayUnion 함수

// 월 제목을 갱신한다
function updateTitle() {
  document.getElementById('month-title').textContent = `${viewYear}년 ${viewMonth}월`;
}

// 달력 전체를 다시 그린다
function renderCalendar() {
  try {
    updateTitle();
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';

    // 탭에 따라 cal-wrap에 클래스를 토글해 셀 높이를 조절
    document.getElementById('cal-wrap').classList.toggle('early-tab', activeTab === 'early');

    const firstDateStr = `${viewYear}-${String(viewMonth).padStart(2,'0')}-01`;
    const daysInMonth  = new Date(viewYear, viewMonth, 0).getDate();
    const firstDow     = getDow(firstDateStr); // 0=일 → 그만큼 앞을 빈칸으로
    const today        = todayStr();

    // 첫 주 앞부분 빈 칸
    for (let i = 0; i < firstDow; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      grid.appendChild(empty);
    }

    // 날짜별 셀 생성
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = `${viewYear}-${String(viewMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      grid.appendChild(buildCell(ds, today));
    }
  } catch (e) {
    showError('달력 표시 중 오류가 발생했습니다: ' + e.message);
  }
}

// 날짜 셀 DOM 요소를 만들어 반환한다
function buildCell(dateStr, today) {
  const cell       = document.createElement('div');
  const dow        = getDow(dateStr);
  const holName    = getHolidayName(dateStr);
  const isSat      = dow === 6;
  const isSun      = dow === 0;
  const isHol      = !!holName;
  const isToday    = dateStr === today;

  // 기본 클래스
  const classes = ['day-cell'];
  if (isSat)    classes.push('is-sat');
  if (isSun)    classes.push('is-sun');
  if (isHol)    classes.push('is-holiday'); // CSS 선언 순서(is-sat→is-sun→is-holiday)로 공휴일 색이 우선
  if (isToday)  classes.push('is-today');

  // 탭별 내용 구성
  if (activeTab === 'duty') {
    buildDutyContent(cell, dateStr, holName, isToday, classes);
  } else {
    buildEarlyContent(cell, dateStr, holName, isToday, classes);
  }

  cell.className = classes.join(' ');
  // 날짜 셀 클릭 시 슬롯 편집 모달 열기
  cell.style.cursor = 'pointer';
  cell.addEventListener('click', () => window.openModal(dateStr));
  return cell;
}

// 당직·점심 탭의 셀 내용을 채운다
function buildDutyContent(cell, dateStr, holName, isToday, classes) {
  const duty  = getDuty(dateStr);
  const lunch = getLunch(dateStr);

  // 내 일정인지 확인 (내 이름이 당직 또는 점심에 있으면 강조)
  const myInDuty  = myName && duty  && (duty.D === myName || duty.AM === myName || duty.PM === myName);
  const myInLunch = myName && lunch && lunch.name === myName;
  if (myInDuty || myInLunch) classes.push('is-mine');

  cell.appendChild(makeDateNum(dateStr, isToday));
  if (holName) cell.appendChild(makeHolName(holName));

  if (duty) {
    if (duty.D !== undefined) {
      // 평일 당직 1인
      appendSlot(cell, '당직', duty.D, 'slot-duty');
    } else {
      // 주말/공휴일 2인
      appendSlot(cell, '오전', duty.AM, 'slot-am');
      appendSlot(cell, '오후', duty.PM, 'slot-pm');
    }
  }

  // 점심: 따라감(↓) 또는 고정(📌) 표시
  if (lunch) {
    const lunchLabel = lunch.fixed ? `점심📌 ${lunch.name}` : `점심↓ ${lunch.name}`;
    const isMine     = myName && lunch.name === myName;
    const el         = document.createElement('span');
    el.className     = `slot ${isMine ? 'slot-mine' : 'slot-lunch'}`;
    el.textContent   = lunchLabel;
    cell.appendChild(el);
  }
}

// 조기출근 탭의 셀 내용을 채운다
function buildEarlyContent(cell, dateStr, holName, isToday, classes) {
  const early = getEarly(dateStr);
  if (myName && early === myName) classes.push('is-mine');

  cell.appendChild(makeDateNum(dateStr, isToday));
  if (holName) cell.appendChild(makeHolName(holName));
  if (early) appendSlot(cell, '조기', early, 'slot-early');
}

// 날짜 숫자 요소를 만든다
function makeDateNum(dateStr, isToday) {
  const el = document.createElement('div');
  el.className = 'd-num';
  // 날짜 숫자 (앞 0 제거)
  el.textContent = String(parseInt(dateStr.split('-')[2], 10));
  if (isToday) {
    const dot = document.createElement('span');
    dot.className = 'today-dot';
    el.appendChild(dot);
  }
  return el;
}

// 공휴일 이름 요소를 만든다
function makeHolName(name) {
  const el = document.createElement('div');
  el.className   = 'hol-name';
  el.textContent = name;
  return el;
}

// 배정 배지를 생성해 부모에 붙인다 (name이 없으면 건너뜀)
function appendSlot(parent, label, name, colorClass) {
  if (!name) return; // null/undefined 방어
  const isMine = myName && name === myName;
  const el     = document.createElement('span');
  el.className = `slot ${isMine ? 'slot-mine' : colorClass}`;
  el.textContent = `${label} ${name}`;
  parent.appendChild(el);
}

// =============================================================
// ===== 공휴일 관리 (로컬 저장 + Firestore 연동) =====
// =============================================================

// 로컬에 저장된 추가 공휴일을 appState에 불러온다 (Phase 2 이전 fallback)
function loadLocalHolidays() {
  try {
    const raw = localStorage.getItem('dutycal_holidays');
    if (!raw) return;
    const saved = JSON.parse(raw);
    appState.holidayAdds    = saved.adds    || {};
    appState.holidayRemoves = saved.removes || [];
  } catch (_) { /* 손상된 캐시 무시 */ }
}

// 추가 공휴일을 로컬에 저장한다 (Firestore 미연결 시 사용)
function saveLocalHolidays() {
  localStorage.setItem('dutycal_holidays', JSON.stringify({
    adds:    appState.holidayAdds,
    removes: appState.holidayRemoves,
  }));
}

// 공휴일 추가 버튼 핸들러 — 날짜·이름을 받아 holidayAdds에 기록
window.addCustomHoliday = async function () {
  const dateInput = document.getElementById('hol-date-input');
  const nameInput = document.getElementById('hol-name-input');
  const dateStr   = dateInput.value;
  const name      = nameInput.value.trim();

  if (!dateStr || !name) {
    alert('날짜와 공휴일 이름을 모두 입력해주세요.');
    return;
  }

  appState.holidayAdds[dateStr] = name;

  if (isFirestoreMode && fsDocRef && _updateDoc) {
    try {
      // 필드 단위 업데이트 (맵의 한 항목만 추가, 다른 날짜 덮어쓰지 않음)
      await _updateDoc(fsDocRef, { [`holidayAdds.${dateStr}`]: name });
    } catch (e) { showError('공휴일 저장 오류: ' + e.message); }
  } else {
    saveLocalHolidays();
  }

  dateInput.value = '';
  nameInput.value = '';
  renderHolidayList();
  renderCalendar();
};

// 공휴일 삭제 버튼 핸들러 — holidayAdds에서 해당 날짜 항목 제거
window.deleteCustomHoliday = async function (dateStr) {
  delete appState.holidayAdds[dateStr];

  if (isFirestoreMode && fsDocRef && _updateDoc && _deleteField) {
    try {
      // deleteField()로 맵의 특정 키만 삭제
      await _updateDoc(fsDocRef, { [`holidayAdds.${dateStr}`]: _deleteField() });
    } catch (e) { showError('공휴일 삭제 오류: ' + e.message); }
  } else {
    saveLocalHolidays();
  }

  renderHolidayList();
  renderCalendar();
};

// 추가된 공휴일 목록을 패널 안에 렌더링한다
function renderHolidayList() {
  const container = document.getElementById('custom-hol-list');
  const adds      = appState.holidayAdds;
  const dates     = Object.keys(adds).sort();

  if (dates.length === 0) {
    container.innerHTML = '<div class="hol-empty">추가된 공휴일이 없습니다.</div>';
    return;
  }

  container.innerHTML = '';
  const list = document.createElement('div');
  list.className = 'hol-list';

  for (const d of dates) {
    const item = document.createElement('div');
    item.className = 'hol-item';
    // 날짜를 data 속성에 두어 XSS 없이 onclick에서 참조
    item.innerHTML = `
      <span class="hol-item-info">
        <span class="hol-item-date">${d}</span>${adds[d]}
      </span>
      <button class="hol-del-btn" data-date="${d}" onclick="deleteCustomHoliday(this.dataset.date)">삭제</button>
    `;
    list.appendChild(item);
  }
  container.appendChild(list);
}

// 설정 패널 열기/닫기 토글 — 열 때 인원 목록과 통계를 갱신한다
window.toggleSettings = function () {
  const panel = document.getElementById('settings-panel');
  const isOpening = !panel.classList.contains('open');
  panel.classList.toggle('open');
  if (isOpening) {
    renderSegments();
    renderStats();
    // 조기출근 주말 포함 체크박스 상태 동기화
    const chk = document.getElementById('early-weekend-chk');
    if (chk) chk.checked = appState.earlyIncludeWeekend;
  }
};

// =============================================================
// ===== Firebase 초기화 및 실시간 구독 (Phase 2) =====
// =============================================================

// FIREBASE_CONFIG가 설정되어 있으면 Firestore 실시간 모드로 전환한다
async function initFirebase() {
  if (!FIREBASE_CONFIG) return; // 설정 전: 로컬 모드 유지

  try {
    // Firebase SDK를 gstatic CDN에서 동적으로 불러온다 (빌드 단계 없이 사용)
    // 버전을 바꾸려면 아래 URL의 숫자 부분만 수정하세요
    const { initializeApp } = await import(
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'
    );
    const {
      getFirestore, doc, onSnapshot,
      setDoc, updateDoc, deleteField, arrayUnion,
    } = await import(
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'
    );
    const { getAuth, signInAnonymously } = await import(
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'
    );

    // 모듈 스코프 변수에 저장 — 다른 함수(공휴일 추가·삭제 등)에서 사용
    _updateDoc   = updateDoc;
    _deleteField = deleteField;
    _arrayUnion  = arrayUnion;

    const app  = initializeApp(FIREBASE_CONFIG);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    // 익명 로그인 (가입 없이 Firestore 규칙 통과용)
    await signInAnonymously(auth);

    fsDocRef = doc(db, 'dutyCalendar', 'state');

    // 실시간 구독: 문서가 바뀌면 appState를 교체하고 화면을 다시 그린다
    onSnapshot(fsDocRef, async (snap) => {
      if (!snap.exists()) {
        // 최초 실행: 기본값으로 문서 생성 (setDoc 후 onSnapshot이 재호출됨)
        await setDoc(fsDocRef, {
          segments:            DEFAULT_SEGMENTS,
          overrides:           {},
          lunchOverrides:      {},
          earlyOverrides:      {},
          earlyIncludeWeekend: false,
          holidayAdds:         {},
          holidayRemoves:      [],
          logs:                [],
        });
        return;
      }

      const data = snap.data();
      // Firestore 데이터로 appState를 완전히 교체한다
      appState = {
        segments:            data.segments            || DEFAULT_SEGMENTS,
        overrides:           data.overrides           || {},
        lunchOverrides:      data.lunchOverrides      || {},
        earlyOverrides:      data.earlyOverrides      || {},
        earlyIncludeWeekend: data.earlyIncludeWeekend ?? false,
        holidayAdds:         data.holidayAdds         || {},
        holidayRemoves:      data.holidayRemoves       || [],
        logs:                data.logs               || [],
      };

      isFirestoreMode = true;
      document.getElementById('sync-status').textContent = '🟢 실시간 연결됨';
      if (activeTab === 'logs') {
        renderLogs();
      } else {
        renderCalendar();
      }
      renderHolidayList();
      // 설정 패널이 열려 있으면 인원 목록과 통계도 갱신
      if (document.getElementById('settings-panel').classList.contains('open')) {
        renderSegments();
        renderStats();
      }
    }, (err) => {
      showError('Firestore 연결 오류: ' + err.message);
    });

  } catch (e) {
    showError('Firebase 초기화 오류: ' + e.message);
    // 오류 시 로컬 모드 유지 (isFirestoreMode = false)
  }
}

// 날짜 셀 클릭 시 슬롯 편집 모달을 연다
window.openModal = function (dateStr) {
  const modal     = document.getElementById('slot-modal');
  const slotsDiv  = document.getElementById('modal-slots');
  const seg       = getSegment(dateStr);
  const members   = seg ? seg.members : [];

  document.getElementById('modal-date-title').textContent = formatDateKo(dateStr);
  slotsDiv.innerHTML = '';

  // 당직 슬롯
  const duty = getDuty(dateStr);
  if (duty) {
    if (duty.D !== undefined) {
      slotsDiv.appendChild(makeModalSlotRow(dateStr, 'D', '당직', duty.D, members));
    } else {
      slotsDiv.appendChild(makeModalSlotRow(dateStr, 'AM', '오전당직', duty.AM, members));
      slotsDiv.appendChild(makeModalSlotRow(dateStr, 'PM', '오후당직', duty.PM, members));
    }
  }

  // 점심 슬롯 (근무일에만)
  const lunch = getLunch(dateStr);
  if (lunch) {
    slotsDiv.appendChild(makeModalLunchRow(dateStr, lunch, members));
  }

  // 조기출근 슬롯
  const earlyName = getEarly(dateStr);
  if (earlyName) {
    slotsDiv.appendChild(makeModalSlotRow(dateStr, 'E', '조기출근', earlyName, members));
  }

  if (slotsDiv.children.length === 0) {
    slotsDiv.innerHTML = '<p style="color:var(--muted);font-size:0.82rem;padding:10px 0;">이 날은 배정된 슬롯이 없습니다.</p>';
  }

  modal.classList.add('open');
};

// 날짜를 한국어로 포맷한다 (예: 2026년 6월 10일 (화))
function formatDateKo(dateStr) {
  const [y, m, d]  = dateStr.split('-').map(Number);
  const dowNames   = ['일','월','화','수','목','금','토'];
  return `${y}년 ${m}월 ${d}일 (${dowNames[getDow(dateStr)]})`;
}

// 모달을 닫는다
window.closeModal = function () {
  document.getElementById('slot-modal').classList.remove('open');
};

// 모달 오버레이(배경) 클릭 시 닫기
window.handleModalOverlayClick = function (e) {
  if (e.target === document.getElementById('slot-modal')) closeModal();
};

// 당직·조기출근 슬롯 행 DOM을 만든다
function makeModalSlotRow(dateStr, kind, label, name, members) {
  const row = document.createElement('div');
  row.className = 'modal-slot-row';

  const labelEl = document.createElement('span');
  labelEl.className   = 'modal-slot-label';
  labelEl.textContent = label;

  const nameEl = document.createElement('span');
  nameEl.className   = 'modal-slot-name';
  nameEl.textContent = name;

  // 변경용 드롭다운
  const sel = document.createElement('select');
  sel.className = 'modal-select';
  members.forEach(m => {
    const opt = document.createElement('option');
    opt.value   = m;
    opt.textContent = m;
    if (m === name) opt.selected = true;
    sel.appendChild(opt);
  });

  const reassignBtn = document.createElement('button');
  reassignBtn.className   = 'modal-btn primary';
  reassignBtn.textContent = '변경';
  reassignBtn.onclick     = () => doReassign(dateStr, kind, sel.value);

  const area = document.createElement('div');

  area.innerHTML = `
    <label>교대할 날짜와 슬롯 선택</label>
    <div class="modal-swap-row">
      <input type="date" class="swap-date-input" value="${dateStr}">
      <select class="swap-kind-select">
        <option value="D">당직</option>
        <option value="AM">오전당직</option>
        <option value="PM">오후당직</option>
        <option value="L">점심</option>
        <option value="E">조기출근</option>
      </select>
      <button class="modal-btn primary swap-confirm-btn">교대</button>

  `;

// kind에 따라 사용할 override 맵 이름을 반환한다
function overrideMapName(kind) {
  if (kind === 'L') return 'lunchOverrides';
  if (kind === 'E') return 'earlyOverrides';
  return 'overrides';
}

// override 반영 전 현재 슬롯 담당자를 반환한다 (로그의 oldName 용)
function getCurrentSlotName(dateStr, kind) {
  if (kind === 'L') { const r = getLunch(dateStr); return r ? r.name : ''; }
  if (kind === 'E') return getEarly(dateStr) || '';
  const duty = getDuty(dateStr);
  return duty ? (duty[kind] || '') : '';
}

// 슬롯 변경: 해당 날짜·kind 슬롯을 newName으로 교체하고 Firestore에 기록한다
window.doReassign = async function (dateStr, kind, newName) {
  const key    = `${dateStr}__${kind}`;
  const mapKey = overrideMapName(kind);
  const oldName = getCurrentSlotName(dateStr, kind);

  appState[mapKey][key] = newName;

  const kindLabel = { D:'당직', AM:'오전당직', PM:'오후당직', L:'점심', E:'조기출근' };
  const logEntry = {
    type:    kind === 'L' ? 'lunch' : kind === 'E' ? 'early' : 'duty',
    action:  'reassign',
    dateStr, kind, oldName, newName,
    by: myName || '(이름 미설정)',
    at: new Date().toISOString(),
  };

  if (isFirestoreMode && fsDocRef && _updateDoc) {
    try {
      await _updateDoc(fsDocRef, {
        [`${mapKey}.${key}`]: newName,
        logs: _arrayUnion(logEntry),
      });
    } catch (e) { showError('변경 저장 오류: ' + e.message); return; }
  }

  closeModal();
  renderCalendar();
};

// 점심 고정/해제 — 고정 = 현재 이름을 override로 박음, 해제 = override 삭제
window.toggleLunchPin = async function (dateStr, lunch) {
  const key = `${dateStr}__L`;

  if (lunch.fixed) {
    // 고정 해제
    delete appState.lunchOverrides[key];
    const logEntry = {
      type: 'lunch', action: 'unpin', dateStr,
      by: myName || '(이름 미설정)', at: new Date().toISOString(),
    };
    if (isFirestoreMode && fsDocRef && _updateDoc && _deleteField) {
      try {
        await _updateDoc(fsDocRef, {
          [`lunchOverrides.${key}`]: _deleteField(),
          logs: _arrayUnion(logEntry),
        });
      } catch (e) { showError('고정 해제 오류: ' + e.message); return; }
    }
  } else {
    // 고정: 현재 담당자를 override로 기록
    appState.lunchOverrides[key] = lunch.name;
    const logEntry = {
      type: 'lunch', action: 'pin', dateStr, name: lunch.name,
      by: myName || '(이름 미설정)', at: new Date().toISOString(),
    };
    if (isFirestoreMode && fsDocRef && _updateDoc) {
      try {
        await _updateDoc(fsDocRef, {
          [`lunchOverrides.${key}`]: lunch.name,
          logs: _arrayUnion(logEntry),
        });
      } catch (e) { showError('고정 저장 오류: ' + e.message); return; }
    }
  }

  closeModal();
  renderCalendar();
};

// 모달 내 맞교대 area에서 날짜·kind를 읽어 두 슬롯을 교체한다
async function doSwapFromArea(dateStr1, kind1, area) {
  const date2 = area.querySelector('.swap-date-input').value;
  const kind2 = area.querySelector('.swap-kind-select').value;

  if (!date2) { alert('교대할 날짜를 선택해주세요.'); return; }
  if (date2 === dateStr1 && kind2 === kind1) {
    alert('같은 슬롯과는 교대할 수 없습니다.'); return;
  }

  const name1 = getCurrentSlotName(dateStr1, kind1);
  const name2 = getCurrentSlotName(date2, kind2);
  if (!name1 || !name2) { alert('해당 슬롯의 담당자를 확인할 수 없습니다.'); return; }

  const key1 = `${dateStr1}__${kind1}`;
  const key2 = `${date2}__${kind2}`;
  const map1 = overrideMapName(kind1);
  const map2 = overrideMapName(kind2);

  appState[map1][key1] = name2;
  appState[map2][key2] = name1;

  const logEntry = {
    type: 'swap', action: 'swap',
    slot1: { dateStr: dateStr1, kind: kind1, name: name1 },
    slot2: { dateStr: date2,    kind: kind2, name: name2 },
    by: myName || '(이름 미설정)', at: new Date().toISOString(),
  };

  if (isFirestoreMode && fsDocRef && _updateDoc && _arrayUnion) {
    try {
      await _updateDoc(fsDocRef, {
        [`${map1}.${key1}`]: name2,
        [`${map2}.${key2}`]: name1,
        logs: _arrayUnion(logEntry),
      });
    } catch (e) { showError('맞교대 저장 오류: ' + e.message); return; }
  }

  closeModal();
  renderCalendar();
}

// 변경 내역을 화면에 그린다 (최근 300개, 역순)
function renderLogs() {
  const view = document.getElementById('logs-view');
  const logs = [...(appState.logs || [])].reverse().slice(0, 300);

  if (logs.length === 0) {
    view.innerHTML = '<div class="log-empty">변경 내역이 없습니다.</div>';
    return;
  }

  view.innerHTML = '';
  for (const log of logs) {
    const item = document.createElement('div');
    item.className = 'log-item';

    const tag = document.createElement('span');
    tag.className   = `log-tag ${log.type || 'duty'}`;
    const tagLabels = { duty:'당직', lunch:'점심', early:'조기', swap:'교대', seg:'인원' };
    tag.textContent = tagLabels[log.type] || log.type;

    const body = document.createElement('div');
    body.className   = 'log-body';
    body.textContent = formatLogText(log);

    const time = document.createElement('div');
    time.className   = 'log-time';
    time.textContent = log.at ? log.at.slice(0,16).replace('T',' ') : '';

    item.append(tag, body, time);
    view.appendChild(item);
  }
}

// 로그 항목 하나를 읽기 좋은 문자열로 변환한다
function formatLogText(log) {
  const by = log.by || '';
  const kl = { D:'당직', AM:'오전당직', PM:'오후당직', L:'점심', E:'조기출근' };
  if (log.action === 'reassign') {
    return `${log.dateStr} ${kl[log.kind]||log.kind}: ${log.oldName} → ${log.newName}  (${by})`;
  }
  if (log.action === 'swap') {
    const s1 = log.slot1, s2 = log.slot2;
    return `맞교대: ${s1.dateStr} ${kl[s1.kind]||s1.kind}(${s1.name}) ↔ ${s2.dateStr} ${kl[s2.kind]||s2.kind}(${s2.name})  (${by})`;
  }
  if (log.action === 'pin')     return `${log.dateStr} 점심 고정📌 → ${log.name}  (${by})`;
  if (log.action === 'unpin')   return `${log.dateStr} 점심 고정 해제  (${by})`;
  if (log.action === 'seg-add') return `인원 명단 추가: ${log.from}부터  (${by})`;
  if (log.action === 'seg-del') return `인원 명단 삭제: ${log.from}  (${by})`;
  return JSON.stringify(log);
}

// 인원 명단 목록을 설정 패널에 그린다
function renderSegments() {
  const list = document.getElementById('seg-list');
  if (!list) return;
  list.innerHTML = '';
  const segs = appState.segments || [];

  segs.forEach((seg, idx) => {
    const item = document.createElement('div');
    item.className = 'seg-item';
    const canDelete = segs.length > 1;
    item.innerHTML = `
      <div class="seg-item-head">
        <span class="seg-from">${seg.from} 부터</span>
        ${canDelete
          ? `<button class="seg-del-btn" data-idx="${idx}" onclick="deleteSegment(Number(this.dataset.idx))">삭제</button>`
          : '<span style="font-size:0.70rem;color:var(--muted);">최소 1개</span>'}
      </div>
      <div class="seg-members">당직 인원: ${seg.members.join(', ')}</div>
      <div class="seg-members">조기출근 인원: ${seg.earlyMembers ? seg.earlyMembers.join(', ') : '(당직 명단과 동일)'}</div>
      <div class="seg-members">첫 당직: ${seg.dutyStartName} / 첫 조기: ${seg.earlyStartName || (seg.earlyMembers || seg.members)[0]}</div>
    `;
    list.appendChild(item);
  });
}

// 새 세그먼트를 추가한다
window.addSegment = async function () {
  const from    = document.getElementById('seg-from-input').value;
  const members = document.getElementById('seg-members-input').value
                    .split(',').map(s => s.trim()).filter(Boolean);
  const dStart  = document.getElementById('seg-duty-start-input').value.trim();
  const eStart  = document.getElementById('seg-early-start-input').value.trim();

  if (!from)                { alert('적용 시작일을 입력해주세요.'); return; }
  if (members.length === 0) { alert('인원을 한 명 이상 입력해주세요.'); return; }
  if (!dStart)              { alert('첫 당직자 이름을 입력해주세요.'); return; }
  if (!members.includes(dStart)) { alert('첫 당직자 이름이 인원 목록에 없습니다.'); return; }
  if (appState.segments.some(s => s.from === from)) {
    alert('같은 시작일의 명단이 이미 있습니다. 삭제 후 다시 추가해주세요.'); return;
  }

  const newSeg = { from, members, dutyStartName: dStart };
  if (eStart && members.includes(eStart)) newSeg.earlyStartName = eStart;

  const newSegs = [...appState.segments, newSeg].sort((a, b) => a.from.localeCompare(b.from));
  appState.segments = newSegs;

  const logEntry = {
    type: 'seg', action: 'seg-add', from, members,
    by: myName || '(이름 미설정)', at: new Date().toISOString(),
  };

  if (isFirestoreMode && fsDocRef && _updateDoc && _arrayUnion) {
    try {
      await _updateDoc(fsDocRef, { segments: newSegs, logs: _arrayUnion(logEntry) });
    } catch (e) { showError('인원 저장 오류: ' + e.message); return; }
  }

  // 입력 초기화
  ['seg-from-input','seg-members-input','seg-duty-start-input','seg-early-start-input']
    .forEach(id => { document.getElementById(id).value = ''; });

  renderSegments();
  renderCalendar();
};

// 세그먼트를 삭제한다 (마지막 하나는 삭제 불가)
window.deleteSegment = async function (idx) {
  if (appState.segments.length <= 1) { alert('최소 1개의 인원 명단이 있어야 합니다.'); return; }
  if (!confirm(`${appState.segments[idx].from} 명단을 삭제하시겠습니까?`)) return;

  const deleted = appState.segments[idx];
  const newSegs = appState.segments.filter((_, i) => i !== idx);
  appState.segments = newSegs;

  const logEntry = {
    type: 'seg', action: 'seg-del', from: deleted.from,
    by: myName || '(이름 미설정)', at: new Date().toISOString(),
  };

  if (isFirestoreMode && fsDocRef && _updateDoc && _arrayUnion) {
    try {
      await _updateDoc(fsDocRef, { segments: newSegs, logs: _arrayUnion(logEntry) });
    } catch (e) { showError('명단 삭제 오류: ' + e.message); return; }
  }

  renderSegments();
  renderCalendar();
};

// =============================================================
// ===== 조기출근 주말 포함 토글 / 월별 횟수 =====
// =============================================================

// 조기출근 주말·공휴일 포함 여부를 토글하고 Firestore에 저장한다
window.toggleEarlyWeekend = async function (checked) {
  appState.earlyIncludeWeekend = checked;
  if (isFirestoreMode && fsDocRef && _updateDoc) {
    try {
      await _updateDoc(fsDocRef, { earlyIncludeWeekend: checked });
    } catch (e) { showError('설정 저장 오류: ' + e.message); }
  }
  renderCalendar();
};

// 이번 달 인원별 배정 횟수를 집계해 stats-area에 표로 그린다
function renderStats() {
  const area = document.getElementById('stats-area');
  if (!area) return;

  const firstDs = `${viewYear}-${String(viewMonth).padStart(2,'0')}-01`;
  const seg     = getSegment(firstDs);
  if (!seg) { area.innerHTML = '<div style="color:var(--muted);font-size:0.79rem;">인원 명단이 없습니다.</div>'; return; }

  const members = seg.members;
  const counts  = {};
  members.forEach(m => { counts[m] = { duty: 0, lunch: 0, early: 0 }; });

  const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${viewYear}-${String(viewMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const duty = getDuty(ds);
    if (duty) {
      if (duty.D  && counts[duty.D])  counts[duty.D].duty++;
      if (duty.AM && counts[duty.AM]) counts[duty.AM].duty++;
      if (duty.PM && counts[duty.PM]) counts[duty.PM].duty++;
    }
    const lunch = getLunch(ds);
    if (lunch && counts[lunch.name]) counts[lunch.name].lunch++;
    const early = getEarly(ds);
    if (early && counts[early]) counts[early].early++;
  }

  let html = `<table class="stats-table">
    <thead><tr><th>이름</th><th>당직</th><th>점심</th><th>조기출근</th></tr></thead><tbody>`;
  for (const m of members) {
    const c = counts[m] || { duty:0, lunch:0, early:0 };
    html += `<tr><td>${m}</td><td>${c.duty}</td><td>${c.lunch}</td><td>${c.early}</td></tr>`;
  }
  html += '</tbody></table>';
  area.innerHTML = html;
}

// onclick에서 호출하므로 window에 노출 (module scope 우회)
window.switchTab = function (tab) {
  activeTab = tab;
  document.getElementById('tab-duty') .classList.toggle('active', tab === 'duty');
  document.getElementById('tab-early').classList.toggle('active', tab === 'early');
  document.getElementById('tab-logs') .classList.toggle('active', tab === 'logs');

  // 달력 영역과 로그 영역을 탭에 따라 전환
  const calWrap  = document.getElementById('cal-wrap');
  const legend   = document.querySelector('.legend');
  const logsView = document.getElementById('logs-view');

  if (tab === 'logs') {
    calWrap.style.display  = 'none';
    legend.style.display   = 'none';
    logsView.style.display = 'block';
    renderLogs();
  } else {
    calWrap.style.display  = '';
    legend.style.display   = '';
    logsView.style.display = 'none';
    renderCalendar();
  }
};

// 화면 상단에 짧은 오류 안내를 표시한다

}

// 이전 달 버튼
document.getElementById('btn-prev').addEventListener('click', () => {
  viewMonth--;
  if (viewMonth < 1) { viewMonth = 12; viewYear--; }
  renderCalendar();
});

// 다음 달 버튼
document.getElementById('btn-next').addEventListener('click', () => {
  viewMonth++;
  if (viewMonth > 12) { viewMonth = 1; viewYear++; }
  renderCalendar();
});

// 오늘 버튼
document.getElementById('btn-today').addEventListener('click', () => {
  const d = new Date();
  viewYear  = d.getFullYear();
  viewMonth = d.getMonth() + 1;
  renderCalendar();
});
